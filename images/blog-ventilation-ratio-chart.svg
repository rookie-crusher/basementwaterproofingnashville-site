<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Chart showing crawl space ventilation ratio requirements of 1 square foot per 150 or 300 square feet">
  <rect width="800" height="500" fill="#f7f5f2"/>
  <text x="400" y="45" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#333">Crawl Space Ventilation Ratios</text>
  <text x="400" y="72" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#666">Net free vent area required per floor area</text>
  <rect x="120" y="140" width="200" height="240" rx="8" fill="#fff" stroke="#0e7490" stroke-width="2"/>
  <text x="220" y="180" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#0e7490">1 : 150</text>
  <text x="220" y="210" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">General requirement</text>
  <text x="220" y="235" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">1 sq ft vent per</text>
  <text x="220" y="253" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">150 sq ft crawl area</text>
  <rect x="220" y="280" width="0" height="0" fill="none"/>
  <text x="220" y="310" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#888">Most common in older builds</text>
  <rect x="480" y="140" width="200" height="240" rx="8" fill="#fff" stroke="#164e63" stroke-width="2"/>
  <text x="580" y="180" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#164e63">1 : 300</text>
  <text x="580" y="210" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">With vapor barrier</text>
  <text x="580" y="235" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">1 sq ft vent per</text>
  <text x="580" y="253" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">300 sq ft crawl area</text>
  <text x="580" y="310" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#888">Allowed when ground is covered</text>
  <text x="400" y="420" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666">Modern practice: encapsulate and eliminate vents entirely</text>
</svg>
