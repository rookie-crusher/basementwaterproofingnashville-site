<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Bar chart comparing Tennessee radon levels to the national average">
  <rect width="800" height="500" fill="#f7f5f2"/>
  <text x="400" y="45" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#333">Radon: Tennessee vs. National Average</text>
  <text x="400" y="72" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#666">Average indoor radon concentration (pCi/L)</text>
  <line x1="90" y1="420" x2="710" y2="420" stroke="#999" stroke-width="2"/>
  <line x1="90" y1="420" x2="90" y2="80" stroke="#999" stroke-width="2"/>
  <rect x="180" y="330" width="140" height="90" rx="4" fill="#0e7490"/>
  <text x="250" y="320" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#0e7490">1.3</text>
  <text x="250" y="455" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">National average</text>
  <rect x="480" y="230" width="140" height="190" rx="4" fill="#e11d48"/>
  <text x="550" y="220" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#e11d48">2.0+</text>
  <text x="550" y="455" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">Middle Tennessee</text>
  <line x1="90" y1="120" x2="710" y2="120" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="640" y="110" font-family="sans-serif" font-size="13" fill="#d97706">EPA action level: 4.0 pCi/L</text>
  <text x="400" y="485" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666">Tennessee sits in EPA Zone 1 (highest potential) in many counties</text>
</svg>
