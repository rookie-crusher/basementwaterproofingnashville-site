<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Bar chart comparing 6, 10, 12 and 20 mil vapor retarder thicknesses against code minimums">
  <rect width="800" height="500" fill="#f7f5f2"/>
  <text x="400" y="45" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#333">Vapor Retarder Thickness Comparison</text>
  <text x="400" y="72" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#666">Code minimums vs. reinforced encapsulation liners</text>
  <rect x="110" y="320" width="100" height="120" rx="4" fill="#0e7490"/>
  <text x="160" y="310" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#0e7490">6 mil</text>
  <text x="160" y="455" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">IRC crawl space</text>
  <text x="160" y="473" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">minimum</text>
  <text x="160" y="295" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0e7490">6</text>
  <rect x="270" y="270" width="100" height="170" rx="4" fill="#0891b2"/>
  <text x="320" y="260" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#0891b2">10 mil</text>
  <text x="320" y="455" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">Under-slab</text>
  <text x="320" y="473" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">ASTM E1745 Class A</text>
  <text x="320" y="245" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0891b2">10</text>
  <rect x="430" y="230" width="100" height="210" rx="4" fill="#164e63"/>
  <text x="480" y="220" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#164e63">12 mil</text>
  <text x="480" y="455" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">Typical reinforced</text>
  <text x="480" y="473" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">encapsulation liner</text>
  <text x="480" y="205" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#164e63">12</text>
  <rect x="590" y="140" width="100" height="300" rx="4" fill="#082f49"/>
  <text x="640" y="130" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#082f49">20 mil</text>
  <text x="640" y="455" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">Reinforced</text>
  <text x="640" y="473" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#333">encapsulation liner</text>
  <text x="640" y="115" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#082f49">20</text>
  <line x1="70" y1="440" x2="730" y2="440" stroke="#999" stroke-width="2"/>
  <line x1="70" y1="440" x2="70" y2="100" stroke="#999" stroke-width="2"/>
  <rect x="260" y="480" width="12" height="12" fill="#e11d48"/>
  <text x="278" y="491" font-family="sans-serif" font-size="12" fill="#555">Code minimum (IRC / ASTM)</text>
  <rect x="470" y="480" width="12" height="12" fill="#164e63"/>
  <text x="488" y="491" font-family="sans-serif" font-size="12" fill="#555">Reinforced encapsulation liners</text>
</svg>
