<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Annotated detail of a taped crawl space liner seam showing the six inch code minimum overlap against a twelve inch installed overlap">
  <rect width="800" height="500" fill="#f7f5f2"/>
  <text x="400" y="45" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#333">Liner Seam: Annotated</text>
  <text x="400" y="72" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#666">What the code requires at a lap joint, and what actually gets installed</text>

  <!-- ── PLAN VIEW ─────────────────────────────────────────────────── -->
  <text x="60" y="118" font-family="sans-serif" font-size="12" font-weight="700" fill="#0e7490" letter-spacing="1.5">PLAN VIEW</text>

  <!-- Soil below -->
  <rect x="60" y="130" width="680" height="130" fill="#e7e0d6"/>

  <!-- Lower sheet -->
  <rect x="60" y="130" width="420" height="130" fill="#cfe3ea" stroke="#0e7490" stroke-width="2"/>
  <text x="180" y="200" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0e7490">Sheet A</text>

  <!-- Upper sheet, overlapping -->
  <rect x="360" y="130" width="380" height="130" fill="#b6d5df" stroke="#0e7490" stroke-width="2"/>
  <text x="620" y="200" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0e7490">Sheet B</text>

  <!-- Seam tape over the lap -->
  <rect x="360" y="130" width="120" height="130" fill="#f59e0b" fill-opacity="0.35" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="420" y="196" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#92400e">SEAM</text>
  <text x="420" y="212" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#92400e">TAPED</text>

  <!-- Installed overlap dimension -->
  <line x1="360" y1="285" x2="480" y2="285" stroke="#166534" stroke-width="2" marker-start="url(#tickGreen)" marker-end="url(#tickGreen)"/>
  <text x="420" y="305" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#166534">12 in installed</text>

  <!-- Code minimum dimension, nested inside -->
  <line x1="360" y1="105" x2="420" y2="105" stroke="#e11d48" stroke-width="2" marker-start="url(#tickRed)" marker-end="url(#tickRed)"/>
  <text x="390" y="97" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#e11d48">6 in code min.</text>

  <!-- Leader lines marking the lap edges -->
  <line x1="360" y1="120" x2="360" y2="295" stroke="#78716c" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="480" y1="120" x2="480" y2="295" stroke="#78716c" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="420" y1="90" x2="420" y2="130" stroke="#78716c" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ── SECTION VIEW ──────────────────────────────────────────────── -->
  <text x="60" y="358" font-family="sans-serif" font-size="12" font-weight="700" fill="#0e7490" letter-spacing="1.5">SECTION THROUGH THE LAP</text>

  <!-- Soil -->
  <rect x="60" y="410" width="680" height="34" fill="#a8a29e"/>
  <text x="70" y="433" font-family="sans-serif" font-size="12" fill="#fff">Soil</text>

  <!-- Sheet A laid flat -->
  <rect x="60" y="400" width="430" height="8" fill="#0e7490"/>
  <!-- Sheet B lapped over the top -->
  <rect x="370" y="390" width="370" height="8" fill="#155e75"/>
  <!-- Tape bridging the exposed edge -->
  <path d="M370 388 Q420 378 470 388" fill="none" stroke="#b45309" stroke-width="6" stroke-linecap="round"/>

  <text x="600" y="382" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#155e75">Sheet B over</text>
  <text x="200" y="428" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0e7490">Sheet A under</text>
  <text x="420" y="368" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#92400e">Tape seals the exposed edge</text>

  <defs>
    <marker id="tickGreen" markerWidth="8" markerHeight="12" refX="4" refY="6" orient="auto">
      <line x1="4" y1="0" x2="4" y2="12" stroke="#166534" stroke-width="2"/>
    </marker>
    <marker id="tickRed" markerWidth="8" markerHeight="12" refX="4" refY="6" orient="auto">
      <line x1="4" y1="0" x2="4" y2="12" stroke="#e11d48" stroke-width="2"/>
    </marker>
  </defs>

  <text x="400" y="478" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666">R408.3 sets 6 inches lapped and sealed as the floor, not the target — installers who intend to re-enter the space run 12</text>
</svg>
