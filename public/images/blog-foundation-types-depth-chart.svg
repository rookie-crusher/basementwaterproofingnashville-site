<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Chart showing typical foundation depths for crawl space, slab and basement in Middle Tennessee">
  <rect width="800" height="500" fill="#f7f5f2"/>
  <text x="400" y="45" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#333">Foundation Depths in Middle Tennessee</text>
  <text x="400" y="72" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#666">Typical footing depth below grade</text>

  <line x1="120" y1="420" x2="680" y2="420" stroke="#999" stroke-width="2"/>
  <line x1="120" y1="420" x2="120" y2="90" stroke="#999" stroke-width="2"/>

  <!-- Ground line -->
  <line x1="120" y1="180" x2="680" y2="180" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="130" y="172" font-family="sans-serif" font-size="12" fill="#16a34a">Grade</text>

  <!-- Crawl space -->
  <rect x="180" y="180" width="120" height="120" fill="#0e7490" opacity="0.85"/>
  <text x="240" y="245" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#fff" transform="rotate(-90 240 245)">Crawl</text>
  <text x="240" y="330" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">~2 ft</text>

  <!-- Slab -->
  <rect x="340" y="180" width="120" height="60" fill="#164e63" opacity="0.85"/>
  <text x="400" y="215" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#fff">Slab</text>
  <text x="400" y="270" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">0.5 ft</text>

  <!-- Basement -->
  <rect x="500" y="180" width="120" height="200" fill="#b45309" opacity="0.85"/>
  <text x="560" y="285" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#fff" transform="rotate(-90 560 285)">Basement</text>
  <text x="560" y="410" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">8+ ft</text>

  <text x="400" y="470" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666">Middle Tennessee's clay soil and limestone bedrock influence depth and drainage</text>
</svg>
