<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Side-by-side comparison diagram of damp proofing versus waterproofing on a foundation wall">
  <rect width="800" height="500" fill="#f7f5f2"/>
  <text x="400" y="45" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#333">Damp Proofing vs. Waterproofing</text>
  <text x="400" y="72" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#666">How each coating handles water on a foundation wall</text>

  <!-- Left: Damp proofing -->
  <rect x="60" y="110" width="330" height="340" rx="8" fill="#fff" stroke="#0e7490" stroke-width="2"/>
  <rect x="60" y="110" width="330" height="48" rx="8" fill="#0e7490"/>
  <text x="225" y="141" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#fff">Damp Proofing</text>
  <rect x="120" y="180" width="80" height="200" fill="#d6d3d1" stroke="#78716c" stroke-width="2"/>
  <rect x="120" y="180" width="80" height="30" fill="#0e7490" opacity="0.8"/>
  <text x="160" y="200" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#fff">coating</text>
  <text x="160" y="400" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Stops vapor,</text>
  <text x="160" y="418" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">not liquid water</text>
  <line x1="120" y1="250" x2="80" y2="250" stroke="#e11d48" stroke-width="3" stroke-dasharray="4 3"/>
  <text x="75" y="245" text-anchor="end" font-family="sans-serif" font-size="12" fill="#e11d48">hydrostatic</text>
  <text x="75" y="261" text-anchor="end" font-family="sans-serif" font-size="12" fill="#e11d48">pressure</text>

  <!-- Right: Waterproofing -->
  <rect x="410" y="110" width="330" height="340" rx="8" fill="#fff" stroke="#164e63" stroke-width="2"/>
  <rect x="410" y="110" width="330" height="48" rx="8" fill="#164e63"/>
  <text x="575" y="141" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#fff">Waterproofing</text>
  <rect x="470" y="180" width="80" height="200" fill="#d6d3d1" stroke="#78716c" stroke-width="2"/>
  <rect x="470" y="180" width="80" height="45" fill="#164e63" opacity="0.9"/>
  <text x="510" y="200" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#fff">membrane</text>
  <text x="510" y="400" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">Bonds to wall,</text>
  <text x="510" y="418" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#555">blocks liquid water</text>
  <line x1="470" y1="250" x2="430" y2="250" stroke="#16a34a" stroke-width="3"/>
  <text x="425" y="245" text-anchor="end" font-family="sans-serif" font-size="12" fill="#16a34a">blocked</text>
  <text x="425" y="261" text-anchor="end" font-family="sans-serif" font-size="12" fill="#16a34a">✓</text>

  <text x="400" y="480" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666">Bituminous coating is a damp proofing — it is not listed as a waterproofing material in IRC R406.2</text>
</svg>
