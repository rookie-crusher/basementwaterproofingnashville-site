<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Diagram showing soil gas and radon pathways into a home through cracks and openings">
  <rect width="800" height="500" fill="#f7f5f2"/>
  <text x="400" y="45" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="700" fill="#333">Soil Gas &amp; Radon Entry Pathways</text>
  <text x="400" y="72" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#666">How radon and soil gases move from the ground into a home</text>

  <!-- Ground -->
  <rect x="80" y="240" width="640" height="220" fill="#e7e5e4" stroke="#a8a29e" stroke-width="2"/>
  <text x="400" y="430" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#666">Soil — radon and soil gases rise from decay of uranium in rock (limestone)</text>

  <!-- House -->
  <rect x="280" y="120" width="240" height="120" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="400" y="180" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#92400e">Home</text>
  <rect x="280" y="240" width="240" height="30" fill="#a8a29e" stroke="#78716c" stroke-width="2"/>
  <text x="400" y="260" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="700" fill="#fff">Slab</text>

  <!-- Gas arrows -->
  <line x1="200" y1="440" x2="200" y2="300" stroke="#e11d48" stroke-width="3" stroke-dasharray="5 4" marker-end="url(#arrowGas)"/>
  <line x1="320" y1="440" x2="320" y2="280" stroke="#e11d48" stroke-width="3" stroke-dasharray="5 4" marker-end="url(#arrowGas)"/>
  <line x1="480" y1="440" x2="480" y2="280" stroke="#e11d48" stroke-width="3" stroke-dasharray="5 4" marker-end="url(#arrowGas)"/>
  <line x1="600" y1="440" x2="600" y2="300" stroke="#e11d48" stroke-width="3" stroke-dasharray="5 4" marker-end="url(#arrowGas)"/>

  <!-- Entry points -->
  <circle cx="320" cy="280" r="6" fill="#e11d48"/>
  <text x="330" y="285" font-family="sans-serif" font-size="12" fill="#e11d48">crack in slab</text>
  <circle cx="480" cy="280" r="6" fill="#e11d48"/>
  <text x="490" y="285" font-family="sans-serif" font-size="12" fill="#e11d48">expansion joint</text>
  <circle cx="200" cy="300" r="6" fill="#e11d48"/>
  <text x="150" y="305" font-family="sans-serif" font-size="12" fill="#e11d48">wall crack</text>
  <circle cx="600" cy="300" r="6" fill="#e11d48"/>
  <text x="610" y="305" font-family="sans-serif" font-size="12" fill="#e11d48">pipe penetration</text>

  <defs>
    <marker id="arrowGas" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#e11d48"/>
    </marker>
  </defs>

  <text x="400" y="475" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#666">Depressurization (stack effect) pulls soil gas through every gap into the living space</text>
</svg>
